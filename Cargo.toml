[package]
name = "kblauncher"
version = "2.4.2"
edition = "2021"
authors = ["xovz12-coder"]
description = "Ультра-современный Minecraft лаунчер с «Жидким стеклом» на 100% Rust"

[dependencies]
eframe = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
webbrowser = "1.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
